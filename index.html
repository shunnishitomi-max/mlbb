<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#080d16" />
<title>MPL PH Draft Coach</title>
<style>
:root{--bg:#080d16;--panel:#101826;--panel2:#151f30;--line:#26334a;--text:#f5f8ff;--muted:#8996ab;--blue:#3aa6ff;--red:#ff646b;--green:#61e69c;--gold:#f3c468}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#080d16,#0b111d 55%,#080d16);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;min-height:100vh}.app{max-width:720px;margin:auto;padding:16px 14px 88px}.heroTop{padding:10px 2px 8px}.heroTop h1{font-size:22px;margin:0;font-weight:900;letter-spacing:.3px}.heroTop p{margin:5px 0 0;color:var(--muted);font-size:13px}.stage{position:sticky;top:0;z-index:10;background:rgba(8,13,22,.95);backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:16px;padding:12px;margin:8px 0 12px;box-shadow:0 10px 35px #0008}.sides{display:flex;justify-content:center;gap:10px;font-weight:900}.blue{color:var(--blue)}.red{color:var(--red)}.action{text-align:center;margin-top:5px;font-size:18px;font-weight:900;color:#73bfff}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.card{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:12px}.teamTitle{font-weight:900;font-size:16px}.label{font-size:10px;font-weight:900;letter-spacing:.12em;color:#708099;margin-top:10px}.slot{padding:5px 0;border-bottom:1px solid #1b2739;font-size:13px}.bans{font-size:12px;color:#ff979b;line-height:1.5}.coach{margin-top:12px}.sectionTitle{font-weight:900;font-size:13px;letter-spacing:.03em;margin-bottom:7px}.rec{display:grid;grid-template-columns:28px 1fr auto;gap:8px;align-items:center;padding:10px 0;border-top:1px solid #1d293b;cursor:pointer}.rank{color:#66b8ff;font-weight:900}.name{font-weight:850}.sub{color:var(--muted);font-size:11px;margin-top:2px}.score{font-size:18px;color:var(--green);font-weight:900}.note{font-size:11px;line-height:1.5;color:#7f8ba0;margin-top:8px}.search{width:100%;background:var(--panel);color:#fff;border:1px solid var(--line);border-radius:13px;padding:13px 14px;font-size:15px;outline:none;margin-top:12px}.filters{display:flex;gap:8px;overflow:auto;padding:10px 0}.filter{border:0;background:#151e2c;color:#fff;border-radius:999px;padding:9px 13px;font-size:11px;font-weight:900;white-space:nowrap;cursor:pointer}.filter.on{background:#176db5}.heroes{display:grid;grid-template-columns:1fr 1fr;gap:10px}.heroCard{background:var(--panel);border:1px solid #202b3d;border-radius:14px;padding:12px;min-height:112px;cursor:pointer;transition:.15s}.heroCard:active{transform:scale(.98)}.heroCard.disabled{opacity:.28;pointer-events:none}.dot{width:10px;height:10px;border-radius:50%;margin-bottom:9px}.priority{color:var(--green);font-size:12px;font-weight:900;margin-top:7px}.flex{color:var(--gold);font-size:10px;font-weight:900;margin-top:5px}.controls{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}.btn{border:0;border-radius:13px;padding:14px;color:#fff;font-weight:900;cursor:pointer;background:#202b3d}.btn.primary{background:#176db5}.report h2{margin:0;font-size:15px}.adv{color:#8ec2ff;font-weight:900;margin-top:13px}.big{font-size:24px;font-weight:900;margin-top:4px}.conf{color:var(--gold);font-weight:900;font-size:12px;margin-top:4px}.match{display:grid;grid-template-columns:1fr 70px 1fr;gap:8px;align-items:center;padding:7px 0;border-top:1px solid #1e2a3d;font-size:12px}.match div:nth-child(2){text-align:center;color:#8ca0be;font-weight:900}.match div:last-child{text-align:right}.reportText{color:#c5cedd;font-size:13px;line-height:1.55}.bottom{position:fixed;bottom:0;left:0;right:0;background:rgba(9,14,23,.97);border-top:1px solid #27334a;display:flex;justify-content:center;z-index:20}.bottomInner{width:min(720px,100%);display:grid;grid-template-columns:repeat(5,1fr)}.tab{padding:12px 4px 13px;text-align:center;font-size:11px;color:#78869b;font-weight:800;cursor:pointer}.tab.on{color:#6bbcff}.view{display:none}.view.on{display:block}.statGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.stat{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:13px}.stat b{display:block;font-size:21px}.stat span{color:var(--muted);font-size:11px}.listItem{padding:11px 0;border-top:1px solid #1d293b;display:flex;justify-content:space-between;gap:12px}.pill{font-size:10px;border:1px solid #34445f;border-radius:999px;padding:5px 8px;color:#a9bad4}.empty{color:#8390a5;text-align:center;padding:34px 10px}.footer{font-size:9px;text-align:center;color:#59667a;letter-spacing:.08em;margin-top:18px}@media(max-width:380px){.app{padding-left:10px;padding-right:10px}.heroes{grid-template-columns:1fr}.grid2{grid-template-columns:1fr}.stage{border-radius:12px}}
</style>
</head>
<body>
<div class="app">
<header class="heroTop"><h1>MPL PH DRAFT COACH</h1><p>Mobile-first competitive mock draft simulator · Week 6+ model</p></header>
<section id="draftView" class="view on"></section>
<section id="metaView" class="view"></section>
<section id="heroesView" class="view"></section>
<section id="matchesView" class="view"></section>
<section id="moreView" class="view"></section>
</div>
<nav class="bottom"><div class="bottomInner"><div class="tab on" data-tab="draft">Draft</div><div class="tab" data-tab="meta">Meta</div><div class="tab" data-tab="heroes">Heroes</div><div class="tab" data-tab="matches">Matches</div><div class="tab" data-tab="more">More</div></div></nav>
<script>
const sequence=[['BLUE','BAN',1],['RED','BAN',1],['RED','BAN',2],['BLUE','BAN',2],['BLUE','BAN',3],['RED','BAN',3],['BLUE','PICK',1],['RED','PICK',1],['RED','PICK',2],['BLUE','PICK',2],['BLUE','PICK',3],['RED','PICK',3],['BLUE','BAN',4],['RED','BAN',4],['RED','BAN',5],['BLUE','BAN',5],['RED','PICK',4],['BLUE','PICK',4],['BLUE','PICK',5],['RED','PICK',5]].map(([side,kind,slot])=>({side,kind,slot}));
const heroes=[
['Fanny','JUNGLE',[],96],['Nolan','JUNGLE',[],91],['Aulus','JUNGLE',['EXP'],89],['Belerick','ROAM',['EXP'],90],['Masha','EXP',['ROAM'],93],['Phoveus','EXP',[],86],['Esmeralda','EXP',[],88],['Gloo','EXP',['ROAM'],84],['Yu Zhong','EXP',[],81],['Zhuxin','MID',[],94],['Lylia','MID',[],87],['Novaria','MID',[],85],['Valentina','MID',[],83],['Bruno','GOLD',[],92],['Claude','GOLD',[],88],['Clint','GOLD',[],84],['Obsidia','GOLD',[],90],['Minotaur','ROAM',[],91],['Atlas','ROAM',[],82],['Carmilla','ROAM',[],85],['Mathilda','ROAM',[],88],['Paquito','EXP',['JUNGLE'],82],['Hayabusa','JUNGLE',[],80],['Ling','JUNGLE',[],85],['Fredrinn','JUNGLE',['EXP'],83],['Harith','GOLD',['MID'],87],['Granger','GOLD',[],86],['Kalea','ROAM',['EXP'],86],['Chou','EXP',['ROAM'],79],['Ruby','EXP',['ROAM'],84],['Suyou','JUNGLE',['EXP'],88],['Joy','JUNGLE',['EXP'],84],['Alpha','JUNGLE',['EXP'],82],['Julian','JUNGLE',['MID'],83],['Lancelot','JUNGLE',[],79],['Yi Sun-shin','JUNGLE',[],82],['Gatotkaca','EXP',['ROAM'],83],['Edith','EXP',['ROAM'],82],['Hylos','ROAM',['EXP'],81],['Chip','ROAM',[],86],['Khufra','ROAM',[],84],['Lolita','ROAM',[],80],['Grock','ROAM',['EXP'],82],['Arlott','EXP',['ROAM'],84],['Terizla','EXP',[],82],['X.Borg','EXP',[],79],['Lapu-Lapu','EXP',[],80],['Benedetta','EXP',[],81],['Cici','EXP',[],78],['Yve','MID',[],83],['Cecilion','MID',[],81],['Vexana','MID',[],80],['Pharsa','MID',[],79],['Luo Yi','MID',[],82],['Xavier','MID',[],78],['Kadita','MID',['ROAM'],80],['Beatrix','GOLD',[],84],['Brody','GOLD',[],82],['Irithel','GOLD',[],78],['Moskov','GOLD',[],81],['Karrie','GOLD',[],79],['Wanwan','GOLD',[],77],['Natan','GOLD',['MID'],80],['Melissa','GOLD',[],78]
].map(([name,role,flex,meta])=>({name,role,flex,meta}));
let state={step:0,draft:[],role:'ALL',query:''};
const roleOrder=['EXP','JUNGLE','MID','GOLD','ROAM'];
function picks(side){return state.draft.filter(d=>d.action.side===side&&d.action.kind==='PICK').map(d=>d.hero)}
function used(){return new Set(state.draft.map(d=>d.hero.name))}
function score(hero){const action=sequence[state.step];let s=hero.meta;if(!action)return s;const a=picks(action.side),e=picks(action.side==='BLUE'?'RED':'BLUE');const filled=new Set(a.flatMap(h=>[h.role,...h.flex]));if(action.kind==='PICK'&&!filled.has(hero.role))s+=5;if(hero.flex.length)s+=4;if(action.kind==='BAN')s+=Math.round(hero.meta*.05);if(state.step>=12&&action.kind==='BAN'){const open=roleOrder.filter(r=>!filled.has(r));if(open.includes(hero.role))s+=7;if(hero.flex.some(r=>open.includes(r)))s+=4}if(e.some(x=>x.role===hero.role))s+=2;if(hero.name==='Belerick'&&e.some(x=>['Claude','Bruno','Granger'].includes(x.name)))s+=5;if(hero.name==='Masha'&&e.some(x=>['Fanny','Ling','Nolan'].includes(x.name)))s+=3;return Math.max(0,Math.min(100,s))}
function choose(name){const h=heroes.find(x=>x.name===name),a=sequence[state.step];if(!h||!a||used().has(name))return;state.draft.push({hero:h,action:a});state.step++;state.query='';renderDraft()}
function undo(){if(!state.draft.length)return;state.draft.pop();state.step--;renderDraft()}
function reset(){state={step:0,draft:[],role:'ALL',query:''};renderDraft()}
function team(side){const ps=state.draft.filter(d=>d.action.side===side&&d.action.kind==='PICK'),bs=state.draft.filter(d=>d.action.side===side&&d.action.kind==='BAN');return `<div class="card"><div class="teamTitle ${side==='BLUE'?'blue':'red'}">${side}</div><div class="label">PICKS</div>${[0,1,2,3,4].map(i=>`<div class="slot">${ps[i]?.hero.name||'—'}</div>`).join('')}<div class="label">BANS</div><div class="bans">${bs.map(x=>x.hero.name).join(' · ')||'—'}</div></div>`}
function roleColor(r){return r==='EXP'?'#ff8c42':r==='JUNGLE'?'#65c466':r==='MID'?'#b279ff':r==='GOLD'?'#f5c451':'#42b8ff'}
function renderDraft(){const a=sequence[state.step],complete=!a,u=used();let html=`<div class="stage"><div class="sides"><span class="blue">BLUE SIDE</span><span>vs</span><span class="red">RED SIDE</span></div><div class="action">${complete?'DRAFT COMPLETE':`${a.side} ${a.kind} ${a.slot}`}</div></div><div class="grid2">${team('BLUE')}${team('RED')}</div>`;
if(!complete){const rec=heroes.filter(h=>!u.has(h.name)).map(h=>({...h,score:score(h)})).sort((x,y)=>y.score-x.score).slice(0,5);html+=`<div class="card coach"><div class="sectionTitle">DRAFT COACH · TOP RECOMMENDATIONS</div>${rec.map((h,i)=>`<div class="rec" onclick="choose('${h.name.replace(/'/g,"\\'")}')"><div class="rank">${i+1}</div><div><div class="name">${h.name}</div><div class="sub">${h.role}${h.flex.length?' · Flex '+h.flex.join('/') :''}</div></div><div class="score">${h.score}</div></div>`).join('')}<div class="note">Scores recalculate after every action using meta priority, remaining roles, flex value, enemy pressure, denial value and second-phase targeting. Coaching values are analytical estimates.</div></div><input id="search" class="search" placeholder="Search hero" value="${state.query}" oninput="state.query=this.value;renderHeroGrid()"><div class="filters" id="filters">${['ALL','EXP','JUNGLE','MID','GOLD','ROAM'].map(r=>`<button class="filter ${state.role===r?'on':''}" onclick="state.role='${r}';renderDraft()">${r}</button>`).join('')}</div><div id="heroGrid" class="heroes"></div>`}else{const b=picks('BLUE'),r=picks('RED'),bs=b.reduce((n,h)=>n+h.meta,0)+b.filter(h=>h.flex.length).length*3,rs=r.reduce((n,h)=>n+h.meta,0)+r.filter(h=>h.flex.length).length*3,bp=Math.round(bs/Math.max(1,bs+rs)*100);const rn=(t,role)=>t.find(h=>h.role===role||h.flex.includes(role))?.name||'Flexible';html+=`<div class="card report"><h2>POST-DRAFT REPORT</h2><div class="adv">Draft Advantage</div><div class="big">Blue ${bp}% · Red ${100-bp}%</div><div class="conf">CONFIDENCE · MEDIUM</div><div class="note">Draft advantage is an analytical estimate and does not predict the actual match winner.</div><div style="margin-top:14px">${roleOrder.map(role=>`<div class="match"><div>${rn(b,role)}</div><div>${role}</div><div>${rn(r,role)}</div></div>`).join('')}</div><div class="adv">BLUE WIN CONDITION</div><div class="reportText">Use early objective pressure around Turtle while protecting the Gold Laner until the first major item spike. Convert lane priority into controlled neutral objectives.</div><div class="adv">RED WIN CONDITION</div><div class="reportText">Avoid low-value forced fights, preserve key cooldowns for objective setups, and create side-lane pressure before committing to a full 5v5.</div></div>`}
html+=`<div class="controls"><button class="btn" onclick="undo()">Undo</button><button class="btn primary" onclick="reset()">New Draft</button></div><div class="footer">OFFICIAL MPL PH DATA · CALCULATED DATA · ANALYTICAL INFERENCE · COACHING RECOMMENDATION</div>`;document.getElementById('draftView').innerHTML=html;if(!complete)renderHeroGrid();renderMeta();renderHeroes();renderMatches();renderMore()}
function renderHeroGrid(){const el=document.getElementById('heroGrid');if(!el)return;const u=used(),q=state.query.toLowerCase();const list=heroes.filter(h=>(state.role==='ALL'||h.role===state.role||h.flex.includes(state.role))).filter(h=>h.name.toLowerCase().includes(q));el.innerHTML=list.map(h=>`<div class="heroCard ${u.has(h.name)?'disabled':''}" onclick="choose('${h.name.replace(/'/g,"\\'")}')"><div class="dot" style="background:${roleColor(h.role)}"></div><div class="name">${h.name}</div><div class="sub">${h.role}</div><div class="priority">${score(h)} Draft Score</div>${h.flex.length?`<div class="flex">FLEX · ${h.flex.join(' / ')}</div>`:''}</div>`).join('')}
function renderMeta(){const top=[...heroes].sort((a,b)=>b.meta-a.meta).slice(0,10);document.getElementById('metaView').innerHTML=`<div class="card"><div class="sectionTitle">META DASHBOARD</div><div class="statGrid"><div class="stat"><b>${heroes.length}</b><span>Heroes in browser model</span></div><div class="stat"><b>Week 6+</b><span>Analysis window</span></div></div><div style="margin-top:12px" class="sectionTitle">TOP DRAFT PRIORITY</div>${top.map((h,i)=>`<div class="listItem"><span>${i+1}. ${h.name} <small style="color:#8996ab">${h.role}</small></span><b style="color:#61e69c">${h.meta}</b></div>`).join('')}</div>`}
function renderHeroes(){document.getElementById('heroesView').innerHTML=`<div class="card"><div class="sectionTitle">HERO DIRECTORY</div>${heroes.map(h=>`<div class="listItem"><div><b>${h.name}</b><div class="sub">${h.role}${h.flex.length?' · Flex '+h.flex.join('/') :''}</div></div><span class="pill">${h.meta} PRIORITY</span></div>`).join('')}</div>`}
function renderMatches(){document.getElementById('matchesView').innerHTML=`<div class="card"><div class="sectionTitle">MATCH EXPLORER</div><div class="empty">The browser build keeps the draft simulator fully interactive. Match-level records can be connected to the normalized MPL PH dataset endpoint when available.</div></div>`}
function renderMore(){document.getElementById('moreView').innerHTML=`<div class="card"><div class="sectionTitle">ABOUT THIS MODEL</div><p class="reportText">This browser build separates official match information, calculated statistics, analytical inference, and coaching recommendations. Draft recommendations are dynamic and change after every pick or ban.</p><div class="label">DRAFT SEQUENCE</div><p class="reportText">The simulator enforces the exact 20-action professional sequence used by the mobile build.</p><div class="label">SAMPLE-SIZE RULE</div><p class="reportText">Small samples should never dominate a recommendation. Confidence should rise only when repeated Week 6+ evidence exists.</p></div>`}
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));document.querySelectorAll('.view').forEach(x=>x.classList.remove('on'));t.classList.add('on');document.getElementById(t.dataset.tab+'View').classList.add('on')});renderDraft();
</script>
</body></html>
